{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto" x-data="podcastApp()" x-init="init()">
    <!-- Header -->
    <div class="mb-6 glass-panel p-6 rounded-xl">
        <h1 class="text-3xl font-bold text-white mb-2">
            <i class="fas fa-podcast mr-3 text-yellow-400"></i>Podcasts
        </h1>
        <p class="text-gray-400">Listen to game recaps and analysis</p>
    </div>

    <!-- Podcasts Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" x-show="podcasts.length > 0">
        <template x-for="podcast in podcasts" :key="podcast.filename">
            <div @click="openPlayer(podcast)" 
                 class="glass-panel p-4 rounded-lg cursor-pointer hover:bg-gray-700/50 transition group">
                <div class="flex items-center justify-between">
                    <div class="flex-1">
                        <div class="text-lg font-bold text-white mb-1" x-text="podcast.display_name"></div>
                        <div class="text-sm text-gray-400">
                            <i class="fas fa-headphones mr-1"></i>
                            <span x-text="podcast.filename.split('.').pop().toUpperCase()"></span>
                        </div>
                    </div>
                    <i class="fas fa-play-circle text-2xl text-yellow-400 group-hover:text-yellow-300 transition"></i>
                </div>
            </div>
        </template>
    </div>

    <!-- Empty State -->
    <div x-show="podcasts.length === 0" class="text-center py-12 glass-panel rounded-xl text-gray-400">
        <i class="fas fa-podcast text-4xl mb-3 opacity-50"></i>
        <p>No podcasts available.</p>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="text-center py-12">
        <i class="fas fa-spinner fa-spin text-4xl text-yellow-400 mb-3"></i>
        <p class="text-gray-400">Loading podcasts...</p>
    </div>

    <!-- Audio Player Modal -->
    <div x-show="showPlayer" 
         @click.self="closePlayer()"
         class="fixed inset-0 z-[100] flex items-center justify-center"
         style="background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
        <div class="glass-panel rounded-xl p-6 max-w-2xl w-full mx-4" @click.stop>
            <!-- Header -->
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white" x-text="currentPodcast ? currentPodcast.display_name : 'Podcast'"></h2>
                <button @click="closePlayer()" class="text-gray-400 hover:text-white transition">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <!-- Audio Player -->
            <div x-show="currentPodcast">
                <audio x-ref="audioPlayer" 
                       :src="currentPodcast ? currentPodcast.url : ''" 
                       class="w-full mb-4"
                       controls>
                    Your browser does not support the audio element.
                </audio>

                <!-- Controls -->
                <div class="flex items-center justify-between mt-4">
                    <div class="flex items-center space-x-4">
                        <!-- Speed Control -->
                        <div class="flex items-center space-x-2">
                            <span class="text-gray-400 text-sm">Speed:</span>
                            <button @click="toggleSpeed()" 
                                    class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-white font-semibold transition">
                                <span x-text="playbackSpeed + 'x'"></span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Time Display -->
                    <div class="text-gray-400 text-sm font-mono" x-text="timeDisplay"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    [x-cloak] { display: none !important; }
    audio {
        outline: none;
    }
    audio::-webkit-media-controls-panel {
        background-color: rgba(30, 41, 59, 0.8);
    }
</style>

<script>
function podcastApp() {
    return {
        podcasts: [],
        loading: true,
        showPlayer: false,
        currentPodcast: null,
        playbackSpeed: 1,
        timeDisplay: '0:00 / 0:00',

        async init() {
            await this.loadPodcasts();
        },

        async loadPodcasts() {
            this.loading = true;
            try {
                const response = await fetch('/api/podcasts');
                const data = await response.json();
                if (data.success) {
                    this.podcasts = data.podcasts;
                } else {
                    console.error('Error loading podcasts:', data.error);
                }
            } catch (error) {
                console.error('Error fetching podcasts:', error);
            } finally {
                this.loading = false;
            }
        },

        openPlayer(podcast) {
            console.log('Opening player for:', podcast);
            this.currentPodcast = podcast;
            this.showPlayer = true;
            console.log('showPlayer set to:', this.showPlayer);
            // Wait for modal to show, then set up audio player
            setTimeout(() => {
                const audioEl = this.$refs.audioPlayer;
                if (audioEl) {
                    console.log('Audio element found, setting up');
                    audioEl.playbackRate = this.playbackSpeed;
                    // Remove existing listeners to avoid duplicates
                    const timeUpdateHandler = () => this.updateTimeDisplay();
                    const metadataHandler = () => this.updateTimeDisplay();
                    audioEl.removeEventListener('timeupdate', timeUpdateHandler);
                    audioEl.removeEventListener('loadedmetadata', metadataHandler);
                    // Add listeners
                    audioEl.addEventListener('timeupdate', timeUpdateHandler);
                    audioEl.addEventListener('loadedmetadata', metadataHandler);
                    // Try to load the audio
                    audioEl.load();
                } else {
                    console.warn('Audio element not found after timeout');
                }
            }, 100);
        },

        closePlayer() {
            const audioEl = this.$refs.audioPlayer;
            if (audioEl) {
                audioEl.pause();
                audioEl.currentTime = 0;
            }
            this.showPlayer = false;
            this.currentPodcast = null;
            this.playbackSpeed = 1;
        },

        toggleSpeed() {
            this.playbackSpeed = this.playbackSpeed === 1 ? 2 : 1;
            const audioEl = this.$refs.audioPlayer;
            if (audioEl) {
                audioEl.playbackRate = this.playbackSpeed;
            }
        },

        updateTimeDisplay() {
            const audioEl = this.$refs.audioPlayer;
            if (!audioEl) return;
            const current = audioEl.currentTime || 0;
            const duration = audioEl.duration || 0;
            
            const formatTime = (seconds) => {
                if (!seconds || isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${String(secs).padStart(2, '0')}`;
            };
            
            this.timeDisplay = `${formatTime(current)} / ${formatTime(duration)}`;
        }
    }
}
</script>
{% endblock %}
