{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="glass-panel p-8 rounded-xl shadow-2xl">
        <h2 class="text-2xl font-bold text-center text-white mb-6">Sign Up</h2>

        <form method="POST" action="{{ url_for('signup') }}">
            <div class="mb-6">
                <label class="block text-gray-400 text-sm font-bold mb-2" for="username">
                    Username
                </label>
                <div class="relative">
                    <span class="absolute left-3 top-3 text-gray-500"><i class="fas fa-user"></i></span>
                    <input class="w-full bg-gray-900 border border-gray-600 rounded p-3 pl-10 text-white focus:outline-none focus:border-blue-500"
                           id="username" name="username" type="text" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-gray-400 text-sm font-bold mb-2" for="password">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute left-3 top-3 text-gray-500"><i class="fas fa-lock"></i></span>
                    <input class="w-full bg-gray-900 border border-gray-600 rounded p-3 pl-10 text-white focus:outline-none focus:border-blue-500"
                           id="password" name="password" type="password" placeholder="******************" required>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded transition duration-200" type="submit">
                    Sign Up
                </button>
            </div>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-400">
                    Already have an account? <a href="{{ url_for('login') }}" class="text-blue-400 hover:text-blue-300 font-bold">Login</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
